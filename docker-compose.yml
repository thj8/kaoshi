services:
  mysql:
    image: mysql:8.0
    container_name: kaoshi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kaoshi
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13306:3306"   # 仅本机可连，外部不可达
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kaoshi-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:16379:6379"   # 仅本机可连，外部不可达
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    container_name: kaoshi-server
    environment:
      KAOSHI_ADDR: ":8080"
      KAOSHI_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/kaoshi?charset=utf8mb4&parseTime=True&loc=Local"
      KAOSHI_REDIS_ADDR: "redis:6379"
      KAOSHI_REDIS_PASS: ${REDIS_PASSWORD}
      KAOSHI_JWT_SECRET: ${JWT_SECRET}
      KAOSHI_ADMIN_USER: ${ADMIN_USER}
      KAOSHI_ADMIN_PASS: ${ADMIN_PASS}
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    container_name: kaoshi-web
    ports:
      - "13000:80"
    depends_on:
      - server

volumes:
  mysql_data:
  redis_data:
