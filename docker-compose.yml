services:
  mysql:
    image: mysql:8.0
    container_name: kaoshi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_DATABASE: kaoshi
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13306:3306"   # 仅本机可连，外部不可达
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p***REMOVED***"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kaoshi-redis
    command: ["redis-server", "--requirepass", "***REMOVED***"]
    ports:
      - "127.0.0.1:16379:6379"   # 仅本机可连，外部不可达
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "***REMOVED***", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    container_name: kaoshi-server
    environment:
      KAOSHI_ADDR: ":8080"
      KAOSHI_MYSQL_DSN: "root:***REMOVED***@tcp(mysql:3306)/kaoshi?charset=utf8mb4&parseTime=True&loc=Local"
      KAOSHI_REDIS_ADDR: "redis:6379"
      KAOSHI_REDIS_PASS: "***REMOVED***"
      KAOSHI_JWT_SECRET: "***REMOVED***"
      KAOSHI_ADMIN_USER: "admin"
      KAOSHI_ADMIN_PASS: "***REMOVED***"
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    container_name: kaoshi-web
    ports:
      - "13000:80"
    depends_on:
      - server

volumes:
  mysql_data:
  redis_data:
